<style>

:root{
  --glaze:#130d0b; --glaze-2:#1d1411; --glaze-3:#2a1e19; --line:#3e2c24;
  --clay:#cf6a2f; --clay-hi:#e8874a; --clay-lo:#86391a;
  --bone:#f0e4cc; --bone-dim:#b9a78b; --bone-mute:#85735d;
  --gold:#ebc152; --gold-hi:#ffd463; --aegean:#5b9bd5; --olive:#9bbb55; --blood:#d9493b; --pink:#ff8a7a; --violet:#b48cff;
  --font-display:"Jersey 10","Pixelify Sans",ui-monospace,monospace;
  --font-ui:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --font-num:"Pixelify Sans",ui-monospace,monospace;
  --rad:6px; --rad-sm:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--glaze);color:var(--bone);font:15px/1.35 var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
.gold{color:var(--gold)} .olive{color:var(--olive)} .red{color:var(--pink)} .muted{color:var(--bone-dim)} .blue{color:var(--aegean)}
kbd{font:500 11px/1 var(--font-ui);color:var(--bone-dim);background:#000;padding:3px 5px;border-radius:var(--rad-sm);box-shadow:inset 0 0 0 1px var(--line)}
h2,h3{margin:0;font-weight:600}
p{margin:0}

/* buttons, chips, bars */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--font-ui);color:#160e0b;background:var(--clay);border:0;padding:10px 14px;cursor:pointer;
  box-shadow:inset 0 -3px 0 var(--clay-lo),0 0 0 2px #000;border-radius:var(--rad);white-space:nowrap;transition:background .12s,transform .06s}
.btn:hover{background:var(--clay-hi)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--glaze-3);color:var(--bone-mute);box-shadow:0 0 0 2px #000;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--glaze-2);color:var(--bone);box-shadow:inset 0 0 0 2px var(--line),0 0 0 2px #000}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--clay),0 0 0 2px #000}
.btn.ghost:disabled{color:var(--bone-mute);box-shadow:inset 0 0 0 2px var(--glaze-3),0 0 0 2px #000}
/* .off = can't afford right now: looks disabled but still takes the tap, so it can answer with a "no" sound */
.btn.off,.btn.off:hover{background:var(--glaze-3);color:var(--bone-mute);box-shadow:0 0 0 2px #000;cursor:not-allowed;transform:none}
.btn.ghost.off,.btn.ghost.off:hover{background:var(--glaze-2);box-shadow:inset 0 0 0 2px var(--glaze-3),0 0 0 2px #000}
.btn.small{padding:7px 10px;font-size:13px}
.btn.gold{background:var(--gold);box-shadow:inset 0 -3px 0 #b8913a,0 0 0 2px #000}
.btn.gold:hover{background:var(--gold-hi)}
.btn.danger{background:var(--blood);box-shadow:inset 0 -3px 0 #7a2018,0 0 0 2px #000}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--font-ui);padding:4px 6px;border-radius:var(--rad-sm);white-space:nowrap;background:var(--glaze-3);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
.chip.gold{background:var(--gold);color:#160e0b;box-shadow:none}
.chip.olive{background:var(--olive);color:#160e0b;box-shadow:none}
.chip.blue{background:var(--aegean);color:#0b1520;box-shadow:none}
.chip.red{background:var(--blood);color:#160e0b;box-shadow:none}
.chip.violet{background:var(--violet);color:#160e0b;box-shadow:none}
.bar{position:relative;height:9px;background:#000;border-radius:3px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px var(--line);overflow:hidden;min-width:90px}
.bar>i{position:absolute;left:1px;top:1px;bottom:1px;width:0;background:var(--gold);border-radius:2px;box-shadow:inset 0 -2px 0 #b8913a}
.bar.olive>i{background:var(--olive);box-shadow:inset 0 -2px 0 #6a8a3c}
.bar>i.over{background:var(--blood);box-shadow:inset 0 -2px 0 #7a2018}
.seg{display:inline-flex;background:#000;border-radius:var(--rad);box-shadow:inset 0 0 0 2px var(--line);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--bone-dim);font:600 12px/1 var(--font-ui);padding:6px 9px;border-radius:var(--rad-sm);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#160e0b}
.seg button:hover:not([aria-pressed="true"]){color:var(--bone)}

/* layout */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;width:100%;overflow:hidden}
#app>*{min-width:0}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:var(--glaze-2);box-shadow:0 2px 0 var(--line);position:relative;z-index:5}
.tb-stats{display:flex;flex-wrap:wrap;gap:10px 22px}
.tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{padding:4px 6px}
.icon-btn img{width:27px;height:27px}
.tb-co{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#coName{font-size:28px;line-height:.9}
.tb-cash{display:flex;align-items:center;gap:8px}
.tb-cash>div{display:flex;flex-direction:column}
#cash{font:600 28px/.9 var(--font-num);color:var(--gold)}
#ppm{font-size:13px}
.tb-stat{display:flex;flex-direction:column;gap:3px;min-width:150px}
.tb-btn{background:none;border:0;padding:2px 4px;margin:-2px -4px;text-align:left;cursor:pointer;border-radius:var(--rad-sm)}
.tb-btn:hover{background:var(--glaze-3)}
.lbl{font-size:13px;color:var(--bone-dim)} .lbl b{color:var(--bone);font-weight:600}
.sub{font-size:11px;color:var(--bone-dim)}
#main{display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:#0b0706}
#stage{position:absolute;left:0;top:0}
#map{display:block;cursor:pointer;touch-action:none}
#map.dragging{cursor:grabbing}
#overlay{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}
.goal-pill{display:none;position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);align-items:center;gap:8px;padding:5px 10px 5px 5px;border:0;border-radius:var(--rad);background:rgba(19,13,11,.94);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);font-size:13px;text-align:left;cursor:pointer;z-index:2;color:var(--bone)}
.goal-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-pill b{color:var(--gold)}
/* tutorial coach card, and the glow on the thing to press */
.coach{position:absolute;top:10px;left:10px;z-index:3;width:max-content;max-width:min(340px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:rgba(19,13,11,.96);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold),0 6px 20px rgba(0,0,0,.5);font-size:14px;animation:tin .25s ease-out}
.coach b{color:var(--gold);font-weight:600}
.coach .c-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.coach .c-step{font-size:12px;color:var(--bone-mute)}
.coach .c-skip{background:none;border:0;padding:4px 0;color:var(--bone-dim);font-size:12px;text-decoration:underline;cursor:pointer}
.coach .c-skip:hover{color:var(--bone)}
.coach-hi{animation:coachHi 1.1s ease-in-out infinite}
@keyframes coachHi{0%,100%{outline:3px solid rgba(255,212,99,.95);outline-offset:2px}50%{outline:3px solid rgba(255,212,99,.2);outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.coach-hi{animation:none;outline:3px solid var(--gold-hi);outline-offset:2px}}
/* menu: sound settings */
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;font-size:14px}
.setrow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);margin:0}
.icon-btn[aria-pressed="false"] img{opacity:.75}
.dist{display:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;background:#000;border-radius:var(--rad);box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--line);padding:3px;gap:3px}
.dist button{border:0;background:transparent;color:var(--bone-dim);font:600 13px/1 var(--font-ui);padding:9px 14px;border-radius:var(--rad-sm);cursor:pointer}
.dist button.on{background:var(--gold);color:#160e0b}
.sheet-bar{display:none;position:sticky;top:0;z-index:2;background:var(--glaze-2);align-items:center;justify-content:flex-end;padding:12px 0 4px;margin:0 0 -6px}
.sheet-bar .grab{width:44px;height:5px;border-radius:3px;background:var(--line);position:absolute;left:50%;top:6px;transform:translateX(-50%)}
#nav .sm{display:none}
#side{width:350px;flex:none;overflow-y:auto;background:var(--glaze-2);box-shadow:-2px 0 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
#bottom{background:var(--glaze-2);box-shadow:0 -2px 0 var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));position:relative;z-index:5}
#ticker{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;overflow:hidden}
#ticker .tk-new{overflow:hidden;text-overflow:ellipsis}
#ticker .tk-old{color:var(--bone-mute);overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;flex-wrap:wrap;gap:8px}
#nav .btn img{margin:-6px 0}

/* side panel */
.card{background:var(--glaze);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 .muted{font-weight:400;font-size:12px}
.side-head{display:flex;gap:12px;align-items:center}
.side-head h2{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:.85}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px}
.prow .nm{display:flex;flex-direction:column;min-width:0}
.prow .nm span:last-child{font-size:12px;color:var(--bone-dim)}
.bcard{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px;background:var(--glaze);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.bcard img{width:52px;height:68px;margin:-10px 0}
.bcard .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.bcard .info b{font-size:15px}
.bcard .info span{font-size:12px;color:var(--bone-dim)}
.bcard .act{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.why{font-size:12px;color:var(--pink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--bone-dim)}
.status{font-size:13px;padding:6px 8px;border-radius:var(--rad-sm);background:var(--glaze-3)}
.status.ok{color:var(--olive)} .status.bad{color:var(--pink);background:#3a1a14} .status.warn{color:var(--gold)}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;background:var(--glaze-3);box-shadow:0 0 0 1px #000}
.pips i.on{background:var(--gold)}
.big-prev{width:104px;height:136px;margin:-18px -4px -8px -8px;flex:none}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--gold)}
.tip{font-size:13px;color:var(--bone-dim)}
.tip b{color:var(--bone);font-weight:600}

/* map overlay */
.pop{position:absolute;font:700 18px/1 var(--font-num);color:var(--gold-hi);text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;transform:translate(-50%,0);animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.zlabel{position:absolute;transform:translate(-50%,-50%);font:600 12px/1.2 var(--font-ui);text-align:center;background:rgba(19,13,11,.92);padding:5px 8px;border-radius:var(--rad-sm);box-shadow:0 0 0 2px #000;white-space:nowrap}
.zlabel small{display:block;color:var(--bone-dim);font-weight:400;font-size:11px}
.zlabel.tiny{font-size:10px;padding:3px 5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,5,4,.82);display:grid;place-items:center;z-index:10;padding:12px}
.sheet{width:min(1120px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:var(--glaze);border-radius:8px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:16px 20px 20px}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:-16px;background:var(--glaze);padding:6px 0;z-index:1}
.m-head h2{font:400 44px/.85 var(--font-display);color:var(--gold)}
.m-sub{font-size:14px;color:var(--bone-dim);margin:-6px 0 14px}

/* production web */
.web-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.web{position:relative;width:680px;height:680px;flex:none;transform-origin:top left}
.web svg{position:absolute;inset:0}
.node{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;border-radius:50%;background:var(--glaze-2);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:0}
.node img{width:36px;height:36px}
.node.own{box-shadow:0 0 0 2px #000,0 0 0 4px var(--bone-dim)}
.node.active{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.node.avail{box-shadow:0 0 0 2px #000,0 0 0 4px var(--clay);animation:pulse 1.6s ease-in-out infinite}
.node.locked img{opacity:.35}
.node.sel{outline:3px solid var(--gold-hi);outline-offset:4px}
.node .tag{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:600 10px/1 var(--font-ui);background:#000;color:var(--bone-dim);padding:2px 4px;border-radius:3px;white-space:nowrap}
.node.avail .tag{color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 2px #000,0 0 0 4px var(--clay-hi),0 0 12px 2px rgba(232,135,74,.5)}}
.web-detail{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:10px}
.ringlbl{position:absolute;font:600 11px/1 var(--font-ui);color:var(--bone-mute);letter-spacing:.08em;transform:translate(-50%,-50%);background:var(--glaze);padding:2px 4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.06em;color:var(--bone-dim);text-align:left;font-weight:600;padding:4px 6px;background:var(--glaze)}
.tbl td{padding:4px 6px;border-top:1px solid var(--glaze-3);vertical-align:middle}
.tbl tr.dim td{opacity:.55}
.tbl .r{text-align:right}
.tbl .btns{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.tbl-scroll{overflow-x:auto}

/* stocks */
.st-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px}
@media (max-width:900px){.st-wrap{grid-template-columns:1fr}}
.st-list{display:flex;flex-direction:column;gap:2px}
.st-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 8px;border:0;border-radius:var(--rad);background:transparent;text-align:left;cursor:pointer;width:100%}
.st-row:hover{background:var(--glaze-2)}
.st-row.sel{background:var(--glaze-3);box-shadow:inset 0 0 0 2px var(--gold)}
.st-row .nm{display:flex;flex-direction:column;min-width:0}
.st-row .nm b{font-weight:600}
.st-row .nm small{font-size:12px;color:var(--bone-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .px2{display:flex;flex-direction:column;align-items:flex-end}
.st-detail{display:flex;flex-direction:column;gap:12px}
.st-chart{width:100%;height:240px;background:#0b0706;border-radius:var(--rad);box-shadow:inset 0 0 0 2px var(--line)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--glaze-2);border-radius:var(--rad);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--bone-dim)}
.trade{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:3px}
.lb-row{display:grid;grid-template-columns:52px 36px minmax(0,1fr) auto 80px;gap:10px;align-items:center;padding:5px 10px;border-radius:var(--rad)}
.lb-row.you{background:var(--glaze-3);box-shadow:inset 0 0 0 2px var(--gold)}
.lb-row .rk{font:600 22px/1 var(--font-num);color:var(--bone-dim)}
.lb-row.you .rk,.lb-row.top .rk{color:var(--gold)}
.lb-row .nw{font:600 19px/1 var(--font-num);color:var(--gold);text-align:right}

/* start screen */
.start{position:fixed;inset:0;z-index:20;background:#0b0706;overflow:hidden}
.start-card{width:min(860px,100%);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.brand{font:400 20px/1 var(--font-display);color:var(--bone-dim);letter-spacing:.2em}
.title{margin:0;font:400 84px/.8 var(--font-display);color:var(--bone);text-shadow:0 4px 0 #3a2318;white-space:nowrap}
.title .shine{display:inline-block;padding:0 .04em;text-shadow:none;color:#ffd34d;
  background:linear-gradient(105deg,transparent 0 38%,rgba(255,255,240,.95) 44% 50%,transparent 56% 100%) 120% 0/300% 100% no-repeat,
    linear-gradient(180deg,#fff3b0 0 22%,#ffd34d 22% 52%,#eaa82b 52% 78%,#b9701c 78% 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #86391a) drop-shadow(0 0 10px rgba(255,200,60,.35));
  animation:goldShine 3.2s steps(28) infinite}
@keyframes goldShine{0%{background-position:120% 0,0 0}55%,100%{background-position:-20% 0,0 0}}
@media (prefers-reduced-motion:reduce){.title .shine{animation:none}}
.ver{font-size:13px;color:var(--bone-mute)}
.start-form{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.start-form label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--bone-dim);text-align:left;width:min(360px,100%)}
