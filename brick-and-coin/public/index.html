<style>

:root{
  --glaze:#130d0b; --glaze-2:#1d1411; --glaze-3:#2a1e19; --line:#3e2c24;
  --clay:#cf6a2f; --clay-hi:#e8874a; --clay-lo:#86391a;
  --bone:#f0e4cc; --bone-dim:#b9a78b; --bone-mute:#85735d;
  --gold:#ebc152; --gold-hi:#ffd463; --aegean:#5b9bd5; --olive:#9bbb55; --blood:#d9493b; --pink:#ff8a7a; --violet:#b48cff;
  --font-display:"Jersey 10","Pixelify Sans",ui-monospace,monospace;
  --font-ui:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --font-num:"Pixelify Sans",ui-monospace,monospace;
  --rad:6px; --rad-sm:4px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--glaze);color:var(--bone);font:15px/1.35 var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.disp{font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
.gold{color:var(--gold)} .olive{color:var(--olive)} .red{color:var(--pink)} .muted{color:var(--bone-dim)} .blue{color:var(--aegean)}
kbd{font:500 11px/1 var(--font-ui);color:var(--bone-dim);background:#000;padding:3px 5px;border-radius:var(--rad-sm);box-shadow:inset 0 0 0 1px var(--line)}
h2,h3{margin:0;font-weight:600}
p{margin:0}

/* buttons, chips, bars */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--font-ui);color:#160e0b;background:var(--clay);border:0;padding:10px 14px;cursor:pointer;
  box-shadow:inset 0 -3px 0 var(--clay-lo),0 0 0 2px #000;border-radius:var(--rad);white-space:nowrap;transition:background .12s,transform .06s}
.btn:hover{background:var(--clay-hi)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--glaze-3);color:var(--bone-mute);box-shadow:0 0 0 2px #000;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--glaze-2);color:var(--bone);box-shadow:inset 0 0 0 2px var(--line),0 0 0 2px #000}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--clay),0 0 0 2px #000}
.btn.ghost:disabled{color:var(--bone-mute);box-shadow:inset 0 0 0 2px var(--glaze-3),0 0 0 2px #000}
/* .off = can't afford right now: looks disabled but still takes the tap, so it can answer with a "no" sound */
.btn.off,.btn.off:hover{background:var(--glaze-3);color:var(--bone-mute);box-shadow:0 0 0 2px #000;cursor:not-allowed;transform:none}
.btn.ghost.off,.btn.ghost.off:hover{background:var(--glaze-2);box-shadow:inset 0 0 0 2px var(--glaze-3),0 0 0 2px #000}
.btn.small{padding:7px 10px;font-size:13px}
.btn.gold{background:var(--gold);box-shadow:inset 0 -3px 0 #b8913a,0 0 0 2px #000}
.btn.gold:hover{background:var(--gold-hi)}
.btn.danger{background:var(--blood);box-shadow:inset 0 -3px 0 #7a2018,0 0 0 2px #000}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--font-ui);padding:4px 6px;border-radius:var(--rad-sm);white-space:nowrap;background:var(--glaze-3);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line)}
.chip.gold{background:var(--gold);color:#160e0b;box-shadow:none}
.chip.olive{background:var(--olive);color:#160e0b;box-shadow:none}
.chip.blue{background:var(--aegean);color:#0b1520;box-shadow:none}
.chip.red{background:var(--blood);color:#160e0b;box-shadow:none}
.chip.violet{background:var(--violet);color:#160e0b;box-shadow:none}
.bar{position:relative;height:9px;background:#000;border-radius:3px;box-shadow:0 0 0 1px #000,inset 0 0 0 1px var(--line);overflow:hidden;min-width:90px}
.bar>i{position:absolute;left:1px;top:1px;bottom:1px;width:0;background:var(--gold);border-radius:2px;box-shadow:inset 0 -2px 0 #b8913a}
.bar.olive>i{background:var(--olive);box-shadow:inset 0 -2px 0 #6a8a3c}
.bar>i.over{background:var(--blood);box-shadow:inset 0 -2px 0 #7a2018}
.seg{display:inline-flex;background:#000;border-radius:var(--rad);box-shadow:inset 0 0 0 2px var(--line);padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--bone-dim);font:600 12px/1 var(--font-ui);padding:6px 9px;border-radius:var(--rad-sm);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#160e0b}
.seg button:hover:not([aria-pressed="true"]){color:var(--bone)}

/* layout */
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;width:100%;overflow:hidden}
#app>*{min-width:0}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));background:var(--glaze-2);box-shadow:0 2px 0 var(--line);position:relative;z-index:5}
.tb-stats{display:flex;flex-wrap:wrap;gap:10px 22px}
.tb-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{padding:4px 6px}
.icon-btn img{width:27px;height:27px}
.tb-co{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#coName{font-size:28px;line-height:.9}
.tb-cash{display:flex;align-items:center;gap:8px}
.tb-cash>div{display:flex;flex-direction:column}
#cash{font:600 28px/.9 var(--font-num);color:var(--gold)}
#ppm{font-size:13px}
.tb-stat{display:flex;flex-direction:column;gap:3px;min-width:150px}
.tb-btn{background:none;border:0;padding:2px 4px;margin:-2px -4px;text-align:left;cursor:pointer;border-radius:var(--rad-sm)}
.tb-btn:hover{background:var(--glaze-3)}
.lbl{font-size:13px;color:var(--bone-dim)} .lbl b{color:var(--bone);font-weight:600}
.sub{font-size:11px;color:var(--bone-dim)}
#main{display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden;background:#0b0706}
#stage{position:absolute;left:0;top:0}
#map{display:block;cursor:pointer;touch-action:none}
#map.dragging{cursor:grabbing}
#overlay{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}
.goal-pill{display:none;position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);align-items:center;gap:8px;padding:5px 10px 5px 5px;border:0;border-radius:var(--rad);background:rgba(19,13,11,.94);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);font-size:13px;text-align:left;cursor:pointer;z-index:2;color:var(--bone)}
.goal-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-pill b{color:var(--gold)}
/* tutorial coach card, and the glow on the thing to press */
.coach{position:absolute;top:10px;left:10px;z-index:3;width:max-content;max-width:min(340px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:rgba(19,13,11,.96);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold),0 6px 20px rgba(0,0,0,.5);font-size:14px;animation:tin .25s ease-out}
.coach b{color:var(--gold);font-weight:600}
.coach .c-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.coach .c-step{font-size:12px;color:var(--bone-mute)}
.coach .c-skip{background:none;border:0;padding:4px 0;color:var(--bone-dim);font-size:12px;text-decoration:underline;cursor:pointer}
.coach .c-skip:hover{color:var(--bone)}
.coach-hi{animation:coachHi 1.1s ease-in-out infinite}
@keyframes coachHi{0%,100%{outline:3px solid rgba(255,212,99,.95);outline-offset:2px}50%{outline:3px solid rgba(255,212,99,.2);outline-offset:6px}}
@media (prefers-reduced-motion:reduce){.coach-hi{animation:none;outline:3px solid var(--gold-hi);outline-offset:2px}}
/* menu: sound settings */
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;font-size:14px}
.setrow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold);margin:0}
.icon-btn[aria-pressed="false"] img{opacity:.75}
.dist{display:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;background:#000;border-radius:var(--rad);box-shadow:0 0 0 2px #000,inset 0 0 0 2px var(--line);padding:3px;gap:3px}
.dist button{border:0;background:transparent;color:var(--bone-dim);font:600 13px/1 var(--font-ui);padding:9px 14px;border-radius:var(--rad-sm);cursor:pointer}
.dist button.on{background:var(--gold);color:#160e0b}
.sheet-bar{display:none;position:sticky;top:0;z-index:2;background:var(--glaze-2);align-items:center;justify-content:flex-end;padding:12px 0 4px;margin:0 0 -6px}
.sheet-bar .grab{width:44px;height:5px;border-radius:3px;background:var(--line);position:absolute;left:50%;top:6px;transform:translateX(-50%)}
#nav .sm{display:none}
#side{width:350px;flex:none;overflow-y:auto;background:var(--glaze-2);box-shadow:-2px 0 0 var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
#bottom{background:var(--glaze-2);box-shadow:0 -2px 0 var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));position:relative;z-index:5}
#ticker{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;overflow:hidden}
#ticker .tk-new{overflow:hidden;text-overflow:ellipsis}
#ticker .tk-old{color:var(--bone-mute);overflow:hidden;text-overflow:ellipsis}
#nav{display:flex;flex-wrap:wrap;gap:8px}
#nav .btn img{margin:-6px 0}

/* side panel */
.card{background:var(--glaze);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 .muted{font-weight:400;font-size:12px}
.side-head{display:flex;gap:12px;align-items:center}
.side-head h2{font-family:var(--font-display);font-weight:400;font-size:32px;line-height:.85}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px}
.prow .nm{display:flex;flex-direction:column;min-width:0}
.prow .nm span:last-child{font-size:12px;color:var(--bone-dim)}
.bcard{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px;background:var(--glaze);border-radius:var(--rad);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.bcard img{width:52px;height:68px;margin:-10px 0}
.bcard .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.bcard .info b{font-size:15px}
.bcard .info span{font-size:12px;color:var(--bone-dim)}
.bcard .act{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.why{font-size:12px;color:var(--pink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.kv span:nth-child(odd){color:var(--bone-dim)}
.status{font-size:13px;padding:6px 8px;border-radius:var(--rad-sm);background:var(--glaze-3)}
.status.ok{color:var(--olive)} .status.bad{color:var(--pink);background:#3a1a14} .status.warn{color:var(--gold)}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;background:var(--glaze-3);box-shadow:0 0 0 1px #000}
.pips i.on{background:var(--gold)}
.big-prev{width:104px;height:136px;margin:-18px -4px -8px -8px;flex:none}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:2px;accent-color:var(--gold)}
.tip{font-size:13px;color:var(--bone-dim)}
.tip b{color:var(--bone);font-weight:600}

/* map overlay */
.pop{position:absolute;font:700 18px/1 var(--font-num);color:var(--gold-hi);text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;transform:translate(-50%,0);animation:rise 1.1s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.zlabel{position:absolute;transform:translate(-50%,-50%);font:600 12px/1.2 var(--font-ui);text-align:center;background:rgba(19,13,11,.92);padding:5px 8px;border-radius:var(--rad-sm);box-shadow:0 0 0 2px #000;white-space:nowrap}
.zlabel small{display:block;color:var(--bone-dim);font-weight:400;font-size:11px}
.zlabel.tiny{font-size:10px;padding:3px 5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,5,4,.82);display:grid;place-items:center;z-index:10;padding:12px}
.sheet{width:min(1120px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:var(--glaze);border-radius:8px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:16px 20px 20px}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;position:sticky;top:-16px;background:var(--glaze);padding:6px 0;z-index:1}
.m-head h2{font:400 44px/.85 var(--font-display);color:var(--gold)}
.m-sub{font-size:14px;color:var(--bone-dim);margin:-6px 0 14px}

/* production web */
.web-wrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.web{position:relative;width:680px;height:680px;flex:none;transform-origin:top left}
.web svg{position:absolute;inset:0}
.node{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;border-radius:50%;background:var(--glaze-2);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:0}
.node img{width:36px;height:36px}
.node.own{box-shadow:0 0 0 2px #000,0 0 0 4px var(--bone-dim)}
.node.active{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.node.avail{box-shadow:0 0 0 2px #000,0 0 0 4px var(--clay);animation:pulse 1.6s ease-in-out infinite}
.node.locked img{opacity:.35}
.node.sel{outline:3px solid var(--gold-hi);outline-offset:4px}
.node .tag{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:600 10px/1 var(--font-ui);background:#000;color:var(--bone-dim);padding:2px 4px;border-radius:3px;white-space:nowrap}
.node.avail .tag{color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 2px #000,0 0 0 4px var(--clay-hi),0 0 12px 2px rgba(232,135,74,.5)}}
.web-detail{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:10px}
.ringlbl{position:absolute;font:600 11px/1 var(--font-ui);color:var(--bone-mute);letter-spacing:.08em;transform:translate(-50%,-50%);background:var(--glaze);padding:2px 4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11px;letter-spacing:.06em;color:var(--bone-dim);text-align:left;font-weight:600;padding:4px 6px;background:var(--glaze)}
.tbl td{padding:4px 6px;border-top:1px solid var(--glaze-3);vertical-align:middle}
.tbl tr.dim td{opacity:.55}
.tbl .r{text-align:right}
.tbl .btns{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.tbl-scroll{overflow-x:auto}

/* stocks */
.st-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px}
@media (max-width:900px){.st-wrap{grid-template-columns:1fr}}
.st-list{display:flex;flex-direction:column;gap:2px}
.st-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 8px;border:0;border-radius:var(--rad);background:transparent;text-align:left;cursor:pointer;width:100%}
.st-row:hover{background:var(--glaze-2)}
.st-row.sel{background:var(--glaze-3);box-shadow:inset 0 0 0 2px var(--gold)}
.st-row .nm{display:flex;flex-direction:column;min-width:0}
.st-row .nm b{font-weight:600}
.st-row .nm small{font-size:12px;color:var(--bone-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .px2{display:flex;flex-direction:column;align-items:flex-end}
.st-detail{display:flex;flex-direction:column;gap:12px}
.st-chart{width:100%;height:240px;background:#0b0706;border-radius:var(--rad);box-shadow:inset 0 0 0 2px var(--line)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--glaze-2);border-radius:var(--rad);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--bone-dim)}
.trade{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:3px}
.lb-row{display:grid;grid-template-columns:52px 36px minmax(0,1fr) auto 80px;gap:10px;align-items:center;padding:5px 10px;border-radius:var(--rad)}
.lb-row.you{background:var(--glaze-3);box-shadow:inset 0 0 0 2px var(--gold)}
.lb-row .rk{font:600 22px/1 var(--font-num);color:var(--bone-dim)}
.lb-row.you .rk,.lb-row.top .rk{color:var(--gold)}
.lb-row .nw{font:600 19px/1 var(--font-num);color:var(--gold);text-align:right}
/* v0.07: who's a real player and who's simulated; the gap before your own place; the account line on the starting menu */
.lb-row .lb-tag{text-align:right}
.chip.dim{background:transparent;color:var(--bone-mute);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------------- Inspirapixel splash: the same as Olympus Hunt's ---------------- */
#splash{position:fixed;inset:0;z-index:9999;background:#0b0706;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,44px);cursor:pointer;transition:opacity .45s ease}

  coin(x, y) {
    const d = Math.hypot(x - 7.5, y - 7.5);
    if (d <= 6.8) {
      if ((x === 7 || x === 8) && y >= 4 && y <= 11) return x === 8 ? 'A' : 'Y';
      if (d > 5.4) return (x + y) < 15 ? 'Y' : 'A';
      return 'y';
    }
  },
  pxc(x, y) {
    const d = Math.hypot(x - 7.5, y - 7.5);
    if (d <= 6.8) {
      const P = (x === 6 && y >= 4 && y <= 11) || (y === 4 && x >= 6 && x <= 9) || (y === 7 && x >= 6 && x <= 9) || (x === 9 && y >= 4 && y <= 7);
      if (P) return 'W';
      if (d > 5.4) return (x + y) < 15 ? 'p' : 'P';
      return 'p';
    }
  },
  index(x, y) {
    const d = Math.hypot(x - 7.5, y - 7.5);
    if (d <= 6.8) {
      if (d > 5.6) return 'k';
      const a = Math.atan2(y - 7.5, x - 7.5);
      if (a < -1.2) return 'y';
      if (a < 0.6) return 'g';
      if (a < 2.2) return 'u';
      return 'o';
    }
  },
};

/* ============================================================================
   ART — every sprite is drawn in code at native pixel size (the town canvas is
   480x270 and gets scaled up). Swap any of these for hand-drawn sprites later.
   ========================================================================== */
const K = '#140d0b';

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- icons ---------- */
function iconGrid(name) {
  const g = [];
  for (let y = 0; y < 16; y++) g.push(new Array(16).fill('.'));
  if (PROC_ICONS[name]) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const c = PROC_ICONS[name](x, y); if (c) g[y][x] = c; }
  } else {
    const rows = ICONS[name].replace(/^\n/, '').split('\n');
    rows.forEach((r, y) => { if (y < 16) for (let x = 0; x < 16; x++) g[y][x] = r[x] || '.'; });
  }
  const G = []; for (let y = 0; y < 18; y++) G.push(new Array(18).fill('.'));
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) G[y + 1][x + 1] = g[y][x];
  const O = G.map(r => r.slice());
  for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++) {
    if (G[y][x] !== '.') continue;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const X = x + dx, Y = y + dy;
      if (X >= 0 && X < 18 && Y >= 0 && Y < 18 && G[Y][X] !== '.' && G[Y][X] !== 'k') { O[y][x] = 'k'; break; }
    }
  }
  return O;
}
const ICON_CANVAS = {}, ICON_URL = {};
function iconCanvas(name) {
  if (!ICON_CANVAS[name]) {
    const c = document.createElement('canvas'); c.width = c.height = 18;
    const x = c.getContext('2d'); const O = iconGrid(name);
    for (let j = 0; j < 18; j++) for (let i = 0; i < 18; i++) { const ch = O[j][i]; if (ch !== '.') { x.fillStyle = ch === 'k' ? K : PAL[ch]; x.fillRect(i, j, 1, 1); } }
    ICON_CANVAS[name] = c;
  }
  return ICON_CANVAS[name];
}
function iconURL(name) { return ICON_URL[name] || (ICON_URL[name] = iconCanvas(name).toDataURL()); }
function iconImg(name, size = 36, alt = '') {
  return `<img class="px" src="${iconURL(name)}" width="${size}" height="${size}" alt="${alt}"${alt ? '' : ' aria-hidden="true"'}>`;
}

/* ---------- pixel painter ---------- */
function Painter(ctx, ox = 0, oy = 0) {
  const P = {
    ctx, ox, oy,
    r(x, y, w, h, c) { if (w <= 0 || h <= 0) return; ctx.fillStyle = c; ctx.fillRect(ox + Math.round(x), oy + Math.round(y), Math.round(w), Math.round(h)); },
    p(x, y, c) { ctx.fillStyle = c; ctx.fillRect(ox + Math.round(x), oy + Math.round(y), 1, 1); },
    ell(cx, cy, rx, ry, c) {
      ctx.fillStyle = c;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        const dy = (y + 0.5 - cy) / ry; if (Math.abs(dy) > 1) continue;
        const hw = rx * Math.sqrt(1 - dy * dy);
        const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
        if (x1 > x0) ctx.fillRect(ox + x0, oy + y, x1 - x0, 1);
      }
    },
    sh(x, y, w, h, a = .28) { P.r(x, y, w, h, `rgba(10,6,4,${a})`); },
    icon(name, x, y) { ctx.drawImage(iconCanvas(name), ox + x, oy + y); },
    // a top-down 3/4 building: roof seen from above, front wall facing down
    box(x, y, w, h, rh, roof, wall, o = {}) {
      const [rb, rhi, rlo] = roof, [wb, whi, wlo] = wall;
      if (!o.noShadow) P.sh(x + 3, y + 4, w, h - 2);
      P.r(x, y, w, h, K);
      P.r(x + 1, y + 1, w - 2, rh - 1, rb);
      P.r(x + 1, y + 1, w - 2, 1, rhi);
      if (o.flat) {
        for (let yy = y + 3; yy < y + rh - 1; yy += 3) for (let xx = x + 3; xx < x + w - 2; xx += 6) P.p(xx, yy, rhi);
      } else {
        for (let yy = y + 4; yy < y + rh - 1; yy += 3) {
          P.r(x + 1, yy, w - 2, 1, rlo);
          const off = ((yy - y) / 3) % 2 ? 0 : 2;
          for (let xx = x + 2 + off; xx < x + w - 1; xx += 4) P.p(xx, yy + 1, rhi);
        }
      }
      P.r(x + 1, y + 1, 1, rh - 1, rhi); P.r(x + w - 2, y + 1, 1, rh - 1, rlo);
      P.r(x + 1, y + rh - 1, w - 2, 1, rlo);
      const wy = y + rh, wh = h - rh - 1;
      P.r(x + 1, wy, w - 2, wh, wb);
      P.r(x + 1, wy, w - 2, 1, K);
      const st = o.style || 'wood';
      if (st === 'wood') for (let xx = x + 3; xx < x + w - 2; xx += 3) P.r(xx, wy + 1, 1, wh - 1, wlo);
      if (st === 'log') for (let yy = wy + 2; yy < wy + wh; yy += 2) { P.r(x + 1, yy, w - 2, 1, wlo); P.p(x + 1, yy - 1, whi); P.p(x + w - 2, yy - 1, whi); }
      if (st === 'stone' || st === 'brick') {
        const mort = st === 'brick' ? wlo : wlo;
        for (let yy = wy + 2; yy < wy + wh; yy += 3) {
          P.r(x + 1, yy, w - 2, 1, mort);
          const off = ((yy - wy) / 3) % 2 ? 0 : 2;
          for (let xx = x + 2 + off; xx < x + w - 1; xx += 4) P.p(xx, yy - 1, mort);
        }
      }
      if (st === 'metal') for (let xx = x + 2; xx < x + w - 1; xx += 2) P.r(xx, wy + 1, 1, wh - 1, wlo);
      if (st === 'timber') { for (let xx = x + 1; xx < x + w; xx += 8) P.r(xx, wy + 1, 1, wh - 1, '#4a2e1a'); P.r(x + 1, wy + Math.floor(wh / 2), w - 2, 1, '#4a2e1a'); }
      P.r(x + 1, y + h - 2, w - 2, 1, wlo);
      for (const wx of (o.win || [])) P.win(x + wx, wy + (o.winY ?? 3), o.lit);
      for (const wx of (o.win2 || [])) P.win(x + wx, wy + (o.win2Y ?? 11), o.lit);
      const dw = o.doorW ?? 6;
      if (dw > 0) {
        const dx = o.doorX != null ? x + o.doorX : x + Math.floor(w / 2) - Math.floor(dw / 2);
        const dh = Math.min(wh - 2, o.doorH ?? 9);
        P.r(dx - 1, y + h - 1 - dh - 1, dw + 2, dh + 1, K);
        P.r(dx, y + h - 1 - dh, dw, dh, o.doorC || '#5a3a22');
        if (!o.doorC || o.knob) P.p(dx + dw - 2, y + h - 1 - Math.ceil(dh / 2), '#ebc152');
      }
    },
    win(x, y, lit) {
      P.r(x - 1, y - 1, 6, 5, K);
      P.r(x, y, 4, 3, lit ? '#ffd463' : '#9fd0ff');
      P.p(x, y, lit ? '#fff6d8' : '#cdeeff');
    },
  };
  return P;
}

/* ---------- level looks: every building gets fancier as it levels up ----------
   Lv 2 street lamps · Lv 3 banner flags on the roof · Lv 4 gold roof trim · Lv 5 a gold crown (and sparkles).
   ANCHOR = [roof left x, roof top y, roof right x, has a plain rectangular roof] in lot pixels. */
const ANCHOR = { hq:[2,6,38,1,'clay','stone'], wood:[2,10,26,1,'green','wood'], wheat:[22,-2,39,1,'barn','barnred'], ore:[9,4,31,0,'brown','wood'],
  planks:[2,8,30,1,'slate','wood'], flour:[13,9,27,0,'brown','stone'], charcoal:[4,15,24,0,'darkslate','brick'], chair:[4,6,36,1,'blue','plaster'],
  paper:[1,2,27,1,'brown','plaster'], bread:[4,6,36,1,'shingle','cream'], pasta:[6,6,36,1,'clay','ochre'], iron:[2,10,29,1,'darkslate','darkbrick'],
  nails:[2,8,34,1,'teal','metal'], sofa:[0,4,40,1,'barn','brick'], books:[6,-6,34,1,'purple','brick'], lunchbox:[1,8,39,1,'flat','white'],
  canned:[25,10,40,1,'red','metal'], steel:[0,10,40,1,'metal','grey'], tools:[2,6,32,1,'darkslate','rock'],
  piano:[2,4,38,1,'darkslate','cream'], hamper:[3,6,37,1,'green','cream'], car:[1,2,39,1,'metal','white'] };
const GOLD_ROOF = ['#ebc152', '#ffd463', '#b8913a'];
// the building itself grows: structures behind the main building, drawn before it
function evolveBack(P, type, lv) {
  const [x0, y0, x1, , rk, wk] = ANCHOR[type] || [2, 6, 38, 1, 'brown', 'wood'];
  const roof = ROOF[rk] || ROOF.brown, wall = WALL[wk] || WALL.wood, w = x1 - x0, cx = Math.round((x0 + x1) / 2);
  if (lv >= 3) {                                      // a back wing as wide as the building
    const h = lv >= 4 ? 20 : 13, top = y0 - h + 4;
    if (lv >= 4) chimney(P, x0 + 3, top - 11, 6, 14);  // with its own smokestack
    P.box(x0 + 2, top, w - 4, h, lv >= 4 ? 8 : 7, roof, wall, { style: wk === 'metal' || wk === 'grey' ? 'metal' : 'stone', win: lv >= 4 ? [4, w - 14] : [], lit: true, doorW: 0, winY: 1 });
  }
  if (lv >= 5) {                                      // a gold-roofed tower in the middle
    P.box(cx - 7, y0 - 30, 14, 30, 8, GOLD_ROOF, wall, { style: 'stone', win: [5], win2: [5], winY: 2, win2Y: 9, lit: true, doorW: 0 });
  }
  if (lv >= 2) P.box(x1 - 13, y0 - 7, 13, 13, 6, roof, wall, { style: 'wood', win: [], doorW: 0 });   // an annex shed
}
function decorate(P, type, lv) {
  const [x0, y0, x1, rect] = ANCHOR[type] || [2, 6, 38, 1];
  if (lv >= 2) for (const x of [-2, 39]) { P.r(x, 26, 3, 14, K); P.r(x + 1, 27, 1, 12, '#5a6270'); P.r(x - 1, 23, 5, 4, K); P.r(x, 24, 3, 2, '#ffd463'); }
  if (lv >= 3) for (const [px, c1, c2] of [[x0 + 2, '#d9493b', '#7f2618'], [x1 - 3, '#ebc152', '#b8913a']]) {
    P.r(px - 1, y0 - 8, 3, 9, K); P.r(px, y0 - 8, 1, 8, '#d8ccb4'); P.r(px + 1, y0 - 8, 6, 4, K); P.r(px + 1, y0 - 7, 5, 2, c1); P.p(px + 5, y0 - 6, c2);
  }
  if (lv >= 4) {
    if (rect) { P.r(x0 + 1, y0, x1 - x0 - 2, 1, '#ebc152'); P.r(x0, y0 + 1, 1, 4, '#ebc152'); P.r(x1 - 1, y0 + 1, 1, 4, '#ebc152'); P.p(x0 + 1, y0, '#ffd463'); }
    else { const cx = Math.round((x0 + x1) / 2); P.r(cx - 5, y0 + 2, 10, 6, K); P.r(cx - 4, y0 + 3, 8, 4, '#ebc152'); P.r(cx - 4, y0 + 3, 8, 1, '#ffd463'); }
  }
  if (lv >= 5) {
    const cx = Math.round((x0 + x1) / 2), y = y0 - 39;
    P.r(cx - 5, y - 1, 11, 8, K);
    P.r(cx - 4, y + 2, 9, 4, '#ebc152'); P.r(cx - 4, y + 2, 9, 1, '#ffd463');
    for (const dx of [-4, 0, 4]) { P.r(cx + dx, y, 1, 2, '#ebc152'); P.p(cx + dx, y - 1, K); }
    P.p(cx, y + 3, '#d9493b'); P.p(cx - 3, y + 4, '#5b9bd5'); P.p(cx + 3, y + 4, '#9bbb55');
  }
}
function decorAnim(P, type, lv, t) {
  const [x0, y0, x1] = ANCHOR[type] || [2, 6, 38];
  if (lv >= 2) { const on = Math.sin(t * 3) > -.6; for (const x of [-2, 39]) { P.p(x + 1, 24, on ? '#fff6d8' : '#ffd463'); } }
  if (lv >= 3) for (const px of [x0 + 2, x1 - 3]) { const w = Math.sin(t * 5 + px) > 0; P.p(px + 6, y0 - 7 + (w ? 1 : 0), w ? '#d9493b' : K); }
  if (lv >= 5) for (let k = 0; k < 3; k++) {
    const ph = (t * 1.3 + k * .33) % 1; if (ph > .45) continue;
    const sx = Math.round(4 + ((k * 13 + Math.floor(t * 1.3 + k * .33) * 7) % 32)), sy = Math.round(y0 - 34 + ((k * 11 + Math.floor(t * 1.3) * 5) % 50));
    const c = ph < .2 ? '#fff6d8' : '#ffd463'; P.p(sx, sy, c); if (ph < .3) { P.p(sx - 1, sy, '#ebc152'); P.p(sx + 1, sy, '#ebc152'); P.p(sx, sy - 1, '#ebc152'); P.p(sx, sy + 1, '#ebc152'); }
  }
}
const SPRITES = {};
function buildingSprite(type, lv = 1) {
  const key = type + lv;
  if (!SPRITES[key]) {
    const c = document.createElement('canvas'); c.width = SPR_W; c.height = SPR_H;
    const P = Painter(c.getContext('2d'), SPR_OX, SPR_OY);
    if (lv >= 2) evolveBack(P, type, lv);
    BUILD[type].body(P);
    if (lv >= 2) decorate(P, type, lv);
    SPRITES[key] = c;
  }
  return SPRITES[key];
}
// a static preview image (body + one animation frame) for menus
const PREVIEW_URL = {};
function buildingPreview(type, lv = 1) {
  const key = type + lv;
  if (!PREVIEW_URL[key]) {
    const c = document.createElement('canvas'); c.width = SPR_W; c.height = SPR_H;

    if (BUILD[type].anim) BUILD[type].anim(Painter(ctx, SPR_OX, SPR_OY), 0.35);

      else if (ly === 1 || lx === 1) col = '#a8987c';                 // the lit top and left of each stone

/* ============================================================================

   ========================================================================== */
let S = null;                     // the whole game state (saved as JSON)

const LOG = { onNews: null, onToast: null, onPop: null, onLevel: null, onGoal: null };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

const SAVE_V = 4;                 // save format: 1 = v0.01-v0.03, 2 = v0.04 (Gold Hill), 3 = v0.05 (shared world), 4 = v0.08 (public companies). adopt() brings older saves up to date.
function newGame(company, start) {
  // v0.05: the market, news, rivals and home prices live in the shared world (35_world.js), not in the save
  S = {
    v: SAVE_V, company, start, cash: START_CASH, t: 0, level: 1, hqLv: 0, whLv: 0, tut: 0, settings: null,
    lots: new Array(LOTS).fill(null), inv: {}, unlocked: { [start]: true }, flow: {}, spent: {},
    market: {}, news: [], goal: 0, stats: { sales: 0, built: 0 }, prof: new Array(60).fill(0), profI: 0, profN: 0,
    hold: {}, divAcc: 0, savedAt: nowMs(), boostShown: false, props: PLOTS.map(() => ({ own: false, reno: 1, paid: 0 })),
    pub: null, pubHold: {},   // v0.08: this company's listing (if public), and shares it holds in other players' companies
  };
  S.lots[HQ_LOT] = { b: 'hq', lv: 1 };
  for (const p of PIDS) S.market[p] = { sat: 0, bp: 0, hist: [] };
  if (!WS.ready) WT = worldNow();

/* ---------------------------------------------------------------- helpers */
function countBuildings(s = S) { return s.lots.filter(l => l && l.b !== 'hq').length; }
function activeProducts(s = S) { const set = new Set(); for (const l of s.lots) if (l && l.b !== 'hq') set.add(l.b); return set; }
function capUsed() { let n = 0; for (const l of S.lots) if (l && l.b !== 'hq') n += l.lv; return n; }

function whUsed() { let n = 0; for (const p in S.inv) n += S.inv[p]; return n; }

function buildCost(p) { return BUILD_COST[tierOf(p)]; }

function researchCost(p) { return RESEARCH[tierOf(p)]; }
function hqUpgradeCost() { return HQ_COST[S.hqLv]; }

function lotUnlocked(i) { return ZONE_LEVEL[Math.floor(i / 12)] <= S.level; }

/* ---------------------------------------------------------------- goods market */
// a good's price: its base, today's shared swing and news (the world), what the crowd of players is selling and buying
// (v0.07, crowdMult() in 37_net.js), then this player's own selling and buying pressure
function evMult(p) { return WS.mult[p] || 1; }
function evSpeed(p) { return WS.speed[p] || 1; }
function price(p) {
  const M = S.market[p], D = marketDepth(p);
  return PRODUCTS[p].base * evMult(p) * Math.exp(WS.noise[p] || 0) * crowdMult(p) * ownImpact(M, D);
}
function buyPrice(p) { return price(p) * NPC_MARKUP; }
// your own recent selling (sat) and buying (bp), fading with a 2-minute half-life, against a deep market (v0.09)
function ownImpact(M, D) { const K = OWN_DEPTH * D; return clamp(Math.sqrt((1 + M.bp / K) / (1 + M.sat / K)), OWN_MIN, OWN_MAX); }
// the last 5 minutes of prices for the sparklines, from the world (at today's own selling pressure)
function prefillGoodsHist() {
  const now = Math.floor(WT);
  for (const p of PIDS) {
    const M = S.market[p], D = marketDepth(p), own = ownImpact(M, D); M.hist = [];
    for (let k = 59; k >= 0; k--) { const g = goodsAt(now - 5 * k, WS.evs); M.hist.push(+(PRODUCTS[p].base * (g.mult[p] || 1) * Math.exp(g.noise[p]) * own).toFixed(2)); }
  }
}
function sellGoods(p, q, auto) {
  if (q <= 0) return 0;
  const M = S.market[p], D = marketDepth(p), chunk = Math.max(1, D / 25);
  let left = q, rev = 0;
  while (left > 0) { const c = Math.min(left, chunk); rev += c * price(p); M.sat += c; left -= c; }
  crowdNote(p, q, 0);

}
function buyGoods(p, q) {
  const M = S.market[p], D = marketDepth(p), chunk = Math.max(1, D / 25);
  let left = q, cost = 0;
  while (left > 0) { const c = Math.min(left, chunk); cost += c * buyPrice(p); M.bp += c; left -= c; }

// does making p still pay if every input you don't make yourself is bought from the market?
function buysPay(p) {

  const act = activeProducts(); let cost = 0; for (const q in P.rec) cost += P.rec[q] * (act.has(q) ? price(q) : buyPrice(q));

function sellAllSpare() {

    const q = Math.floor(S.inv[p] - (use > 0 ? Math.max(20, use * 2) : 0));

  for (const l of S.lots) if (l && l.b !== 'hq') { const r = PRODUCTS[l.b].rec[p]; if (r) use += r * 60 / PRODUCTS[l.b].sec * l.lv; }

/* ---------------------------------------------------------------- production */
function stepProduction(dt, offlineRate = 1) {

/* ---------------------------------------------------------------- net worth, levels, rank */

/* ---------------------------------------------------------------- news */

/* ---------------------------------------------------------------- real estate (the housing index comes from the shared world) */

'use strict';
/* ============================================================================
   WORLD (v0.05): the shared market. Every copy of the game works out the same
   stock prices, PixCoin, home prices, rival fortunes, news and price swings from
   one world clock and one seed, so everyone in Millbrook sees the same thing at
   the same moment, with no server and no history to replay: the world at any
   second is a pure function of that second.

     Math.random or anything about the player. The random numbers use only
     integer maths and + - * /, so every browser gets exactly the same ones.
   - Smooth wandering is "value noise" at several time scales, from 15 seconds to
     3 days. It moves like a real market up close but never drifts off forever,
     so the world can run for months.
   - News happens in 30-second slots. Each slot's event (if any) comes from its
     hash: what it is, what it says, how long it lasts and what it moves.
   - What a player does (their own selling and buying pressure on goods) is

  return 'Uses ' + Object.keys(P.rec).map(q => `${P.rec[q]} ${iconImg(q, sz, PRODUCTS[q].name)}`).join(' + ') + ` → makes ${P.out} ${iconImg(p, sz, P.name)}`;
}

function updateLive(root) {
  if (!root) return;
  for (const el of root.querySelectorAll('[data-live]')) {
    const s = el.dataset.live, i = s.indexOf(':'), k = i < 0 ? s : s.slice(0, i), a = i < 0 ? '' : s.slice(i + 1);
    const f = LIVE[k]; if (!f) continue;
    const v = f(a, el); if (v == null) continue;
    const text = typeof v === 'string' ? v : v.text;
    if (el.textContent !== text) el.textContent = text;
    if (typeof v === 'object' && v.cls != null) { const base = el.dataset.base || ''; const c = (base + ' ' + v.cls).trim(); if (el.className !== c) el.className = c; }
  }
  for (const el of root.querySelectorAll('[data-cost]')) {   // not .disabled: an unaffordable button still takes the tap and answers with a "no" sound
    const off = !!el.dataset.block || S.cash < +el.dataset.cost;

function sparkPath(h, w, ht) {
  if (!h || h.length < 2) return '';
  let lo = Infinity, hi = -Infinity; for (const v of h) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const span = hi - lo || 1; let d = '';

  return d;
}

/* ---------- stock chart (drawn at half resolution for a pixel look) ---------- */
function drawStockChart() {
  const c = $('#stChart'); if (!c) return;
  const W = Math.max(120, Math.floor(c.clientWidth / 2)), H = 120;
  if (c.width !== W) { c.width = W; c.height = H; }
  const A = UI.investTab === 're' ? { p: S.house.i, h10: S.house.h10, h60: S.house.h60 } : S.assets[UI.stockSel], tf = UI.stockTF;
  let h = tf === '10m' ? A.h10.slice(-60) : tf === '1h' ? A.h10.slice(-360) : A.h60.slice(-240);
  h = h.concat([A.p]);
  const ctx = c.getContext('2d'); ctx.clearRect(0, 0, W, H);
  if (h.length < 2) return;
  let lo = Math.min(...h), hi = Math.max(...h); const pad = (hi - lo) * .08 || hi * .01; lo -= pad; hi += pad;
  const up = h[h.length - 1] >= h[0], col = up ? '#9bbb55' : '#ff8a7a';
  ctx.fillStyle = '#2a1e19'; for (let g = 1; g < 4; g++) { const y = Math.round(H * g / 4); for (let x = 0; x < W; x += 3) ctx.fillRect(x, y, 1, 1); }
  const Y = v => Math.round((H - 4) - (v - lo) / (hi - lo) * (H - 8));
  let prev = Y(h[0]);
  for (let x = 0; x < W; x++) {
    const i = Math.round(x / (W - 1) * (h.length - 1)), y = Y(h[i]);
    ctx.fillStyle = up ? 'rgba(155,187,85,.16)' : 'rgba(255,138,122,.14)'; ctx.fillRect(x, y, 1, H - y);
    ctx.fillStyle = col; ctx.fillRect(x, Math.min(y, prev), 1, Math.abs(y - prev) + 1); prev = y;
  }
  const y0 = Y(h[0]); ctx.fillStyle = '#85735d'; for (let x = 0; x < W; x += 4) ctx.fillRect(x, y0, 2, 1);
}

function townPostcard() {
  const c = document.createElement('canvas'); c.width = WORLD_W; c.height = WORLD_H;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  drawBackground(MAX_LEVEL); x.drawImage(BG, 0, 0); BG_LEVEL = -1;   // the game draws its own town again when it starts
  const plan = { 1: ['wood', 'wheat', 'ore', 'planks', 'flour', 'charcoal', 'wood', 'wheat', 'planks', 'ore'], 0: ['chair', 'paper', 'bread', 'pasta', 'iron', 'nails', 'chair', 'bread', 'iron'],
    2: ['sofa', 'books', 'lunchbox', 'canned', 'steel', 'tools', 'steel', 'sofa', 'canned'], 3: ['piano', 'hamper', 'car', 'piano', 'car', 'hamper', 'car', 'piano', 'hamper', 'car'] };
  const spots = [];
  for (let b = 0; b < 4; b++) { let k = 0; for (let i = b * 12; i < b * 12 + 12; i++) { if (i === HQ_LOT) { spots.push({ i, b: 'hq', lv: 5 }); continue; } const t = plan[b][k++]; if (t) spots.push({ i, b: t, lv: 1 + (i * 7) % 5 }); } }
  PLOTS.forEach((pl, k) => spots.push({ i: 100 + k, house: pl.t, reno: 1 + k % 3, own: k % 3 !== 1 }));
  spots.sort((a, b) => spotXY(a.i).y - spotXY(b.i).y);
  const P = Painter(x, TX, TY);
  for (const s of spots) {
    const { x: lx, y: ly } = spotXY(s.i);
    if (s.house) {
      x.drawImage(houseSprite(s.house, s.reno), TX + lx - 6, TY + ly - 14);
      if (s.own) { P.r(lx + PLOT - 6, ly - 10, 1, 9, K); P.r(lx + PLOT - 5, ly - 10, 5, 4, K); P.r(lx + PLOT - 5, ly - 9, 4, 2, '#ebc152'); }
      continue;
    }
    const tier = s.lv;
    x.drawImage(buildingSprite(s.b, tier), TX + lx - SPR_OX, TY + ly - SPR_OY);
    if (BUILD[s.b].anim) BUILD[s.b].anim(Painter(x, TX + lx, TY + ly), .35 + s.i * .37);
    if (tier >= 2) decorAnim(Painter(x, TX + lx, TY + ly), s.b, tier, s.i * .37);
    if (s.b !== 'hq') for (let k = 0; k < s.lv; k++) { P.r(lx + 1 + k * 4, ly + LOT - 4, 4, 4, K); P.r(lx + 2 + k * 4, ly + LOT - 3, 2, 2, '#ebc152'); }
  }

/* ============================================================================
   PUBLIC COMPANIES (v0.08): going public, and owning part of other players'
   companies. The server (server/index.js) keeps the share register; cash stays
   in each game, like everything else about a company.
   - A share's price: the company's value plus up to an hour of its profit (at most
     twice its value), over all its shares (pubFair); moved by players buying and
     selling it (pubImpact: the square-root law, fading over half an hour), by the
     market's mood (pubMood: the Millbrook 10 over 4 hours) and by the company's own
     wander (pubWander). The last two come from the shared world, so every player
     sees the same price.
   - Going public issues new shares: the cash goes into the company, and the owner's
     part of it shrinks to match. The owner's net worth is their part of the company
     (netWorth = companyValue × ownFrac); areas of town open with the whole company.
   - A public company pays 30% of its profit as dividends, split by who owns it. The
     outside shareholders' part leaves the company; players' part reaches them
     through the server (pubTake), even while they're away.
   ========================================================================== */
// a listing from the server: [ticker, company, owner, shares, owner's shares, value, profit/min, buying $, selling $, at, dividends paid, listed, players' shares, holders, owner online]
function pubParse(r) { return { ticker: r[0], co: r[1], owner: r[2], total: +r[3], own: +r[4], book: +r[5], profit: +r[6], fb: +r[7], fs: +r[8], ft: +r[9], paid: +r[10], listed: +r[11], held: +r[12], holders: +r[13], online: !!r[14] }; }
function pubListing(t) { return NET.listings.find(L => L.ticker === t) || null; }
function ownFrac() { return S && S.pub && S.pub.total > 0 ? clamp(S.pub.own / S.pub.total, 0, 1) : 1; }
function tickerSeed(t) { let h = 7; for (let i = 0; i < t.length; i++) h = (Math.imul(h, 31) + t.charCodeAt(i)) >>> 0; return h; }
function pubFair(L) { const b = Math.max(0, L.book); return Math.max(.01, (b + Math.min(2 * b, PUB_PREMIUM * Math.max(0, L.profit))) / L.total); }
function pubPressure(L) { const k = Math.pow(.5, Math.max(0, nowMs() - L.ft) / 1000 / PUB_HALF); return [L.fb * k, L.fs * k]; }
function pubImpact(L) { const [fb, fs] = pubPressure(L), D = PUB_DEPTH * pubFair(L) * L.total; return clamp(Math.sqrt((1 + fb / D) / (1 + fs / D)), PUB_MOVE[0], PUB_MOVE[1]); }
function pubMood() { const A = WS.assets.MB10, a = A.h60 && A.h60.length ? A.h60[0] : 0; return a ? clamp(Math.pow(A.p / a, 1.2), .85, 1.18) : 1; }
function pubWander(L) { return Math.exp(fbm(950 + tickerSeed(L.ticker) % 97, WT, .02 / 60, OCT_ID)); }
function pubPrice(L) { return pubFair(L) * pubImpact(L) * pubMood() * pubWander(L); }
// this company's own listing, with its value and profit right now (the server's copy is up to a minute old)
function pubMineL() {
  if (!S || !S.pub) return null;
  const L = pubListing(S.pub.ticker) || { ticker: S.pub.ticker, fb: 0, fs: 0, ft: 0, held: 0, holders: 0, paid: 0 };
  return { ...L, total: S.pub.total, own: S.pub.own, book: companyValue(), profit: profitPerMin() };
}
// shares this company holds in other players' companies, at today's prices (the last known one if a company drops off the list)
function pubHoldValue() {
  if (!S || !S.pubHold) return 0;
  let v = 0; for (const t in S.pubHold) { const h = S.pubHold[t], L = pubListing(t); if (L) h.p = pubPrice(L); v += h.q * (h.p || 0); }
  return v;
}
// dividends: 30% of profit, the outside shareholders' part leaves the company (every 10 s, from step())
function pubPayDividends(dtMin) {
  if (!S.pub) return;
  const out = 1 - ownFrac(), p = profitPerMin(); if (out <= 0 || p <= 0) return;
  const d = PUB_DIV * p * dtMin * out; S.cash -= d; S.pub.paid = (S.pub.paid || 0) + d; if (NET.token) NET.div += d;
}
// what the server says about this company's listing and holdings, dividends received and buyouts (from netTake)
function pubTake(d) {
  if (!('mine' in d) || (d._t0 || 0) < (NET.pubAt || 0)) return;   // not a sync, or one that started before a trade
  S.pub = d.mine ? { ...d.mine, paid: Math.max(S.pub && S.pub.ticker === d.mine.ticker ? S.pub.paid || 0 : 0, d.mine.paid || 0) } : null;
  if (Array.isArray(d.holdings)) {
    const old = S.pubHold || {}; S.pubHold = {};
    for (const [t, q, cost] of d.holdings) { const L = pubListing(t); S.pubHold[t] = { q, cost, p: L ? pubPrice(L) : old[t] ? old[t].p : 0 }; }
  }
  if (d.credit > 0) { S.cash += d.credit; addProfit(d.credit); S.pubDivIn = (S.pubDivIn || 0) + d.credit; }
  for (const [t, co, cash] of d.paidOut || []) pushNews(`${co} (${t}) has closed: your shares were bought out for ${money(cash, false)}`, 'info');
}

function ipoQuote(f) {
  const cv = companyValue(), fair = cv + Math.min(2 * cv, PUB_PREMIUM * Math.max(0, profitPerMin())), raised = fair * f / (1 - f) * IPO_DISCOUNT * (1 - IPO_FEE);

  const n = Math.max(0, Math.min(out - (L.held || 0), (out - target * L.total) / (1 - target)));
  return { n, cash: -n * price * (1 + BUYBACK_FEE) };

async function pubGoPublic(f) {

  if (S.level < PUB_LEVEL) throw new Error(`Reach Level ${PUB_LEVEL} (${LEVELS[PUB_LEVEL].name}) first`);
  if (!NET.token) throw new Error('Log in first (Menu → Online): going public needs the server');
  if (!PUB_STEPS.includes(f)) throw new Error('Pick how much to sell');
  if (!NET.lastSave) await netSync(true);   // the server needs the company before it can list it
  const d = await netCall('/ipo', { f, company: S.company, book: Math.round(companyValue()), profit: profitPerMin() });
  NET.pubAt = Date.now();
  S.cash += d.raised; S.pub = { ...d.mine, paid: 0 };
  pushNews(`${S.company} goes public as ${d.ticker}: ${Math.round(f * 100)}% sold to investors for ${money(d.raised, false)}`, 'up');
  saveLocal(); netSaveNow();
  return `${S.company} is public as ${d.ticker}! +${money(d.raised, false)}`;
}
async function pubFloat(target) {
  const q = floatQuote(target); if (!q) throw new Error(`${S.company} isn’t public`);
  if (q.cash < 0 && S.cash < -q.cash) throw new Error(`Not enough cash: buying back costs about ${money(-q.cash, false)}`);
  const d = await netCall('/float', { f: target, book: Math.round(companyValue()), profit: profitPerMin() });
  NET.pubAt = Date.now();
  S.cash += d.cash; const paid = S.pub.paid || 0; S.pub = d.mine ? { ...d.mine, paid } : null;
  saveLocal(); netSaveNow();
  return d.cash >= 0 ? `Sold new shares: +${money(d.cash, false)}` : d.mine ? `Bought shares back for ${money(-d.cash, false)}` : `${S.company} is private again`;
}
async function pubTrade(t, side, v) {
  const L = pubListing(t); if (!L) throw new Error('Pick a company first');

    if (shares < 1e-3) throw new Error('No shares for sale right now: players hold them all');
  } else {
    const h = S.pubHold[t]; if (!h || h.q <= 0) throw new Error('You own none');
    shares = h.q * v;

  const d = await netCall('/shares', { ticker: t, side, shares, price });

  const amt = shares * d.price;
  if (side === 'buy') S.cash -= amt * (1 + fee); else S.cash += amt * (1 - fee);
  if (d.credit > 0) { S.cash += d.credit; S.pubDivIn = (S.pubDivIn || 0) + d.credit; }
  const had = !!S.pubHold[t];
  if (d.holding) S.pubHold[t] = { q: d.holding[1], cost: d.holding[2], p: d.price }; else delete S.pubHold[t];
  L.holders += (S.pubHold[t] ? 1 : 0) - (had ? 1 : 0);

}

function frame(now) {
  if (!running) return;
  const dt = Math.min(.25, (now - (lastFrame || now)) / 1000); lastFrame = now;
  // keep the shared world on the world clock: nudge small slips, start over after a big one (a sleeping tab, a clock fix)
  const slip = worldNow() - WT;
  if (Math.abs(slip) > 3) { WT = worldNow(); worldReset(); prefillGoodsHist(); renderTicker(); } else if (Math.abs(slip) > .5) WT += slip;
  // idle: no input for IDLE_AFTER seconds. Then it runs like a closed game: a quarter speed, and after OFFLINE_MAX it waits.
  const idle = (nowMs() - lastInput) / 1000 - IDLE_AFTER;
  AWAY_RATE = idle <= 0 ? 1 : idle <= OFFLINE_MAX ? OFFLINE_RATE : 0;
  if (AWAY_RATE < 1 && !idleFrom) idleFrom = { at: lastInput + IDLE_AFTER * 1000, cash: S.cash };
  simAcc += dt; let n = 0;
  while (simAcc >= .2 && n < 10) { step(.2); simAcc -= .2; n++; }
  stepWalkers(dt); stepParticles(dt); stepCamera(dt);
  for (const i in popAcc) { popAcc[i].t -= dt; if (popAcc[i].t <= 0) { if (popAcc[i].v >= 1) { floatText(+i, '+' + money(popAcc[i].v, false)); sfx('cash'); } delete popAcc[i]; } }
  render(now / 1000);
  uiAcc += dt; if (uiAcc >= .25) { uiAcc = 0; updateTop(); renderSide(); renderModal(); updateCoach(); renderGoalPill(); netTick(); }
  saveAcc += dt; if (saveAcc >= 15) { saveAcc = 0; saveLocal(); }
  requestAnimationFrame(frame);
}
