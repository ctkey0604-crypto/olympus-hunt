<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-viewport stage for the village and the hunts; building menus are full-screen
   panels on black glaze, framed by a terracotta meander band like black-figure pottery. */
:root{
  --glaze:#130d0b; --glaze-2:#1d1411; --glaze-3:#2a1e19; --line:#3e2c24;
  --clay:#cf6a2f; --clay-hi:#e8874a; --clay-lo:#86391a;
  --bone:#f0e4cc; --bone-dim:#b9a78b; --bone-mute:#85735d;
  --gold:#ebc152; --aegean:#5b9bd5; --olive:#9bbb55; --blood:#d9493b;
  --r1:#d8ccb4; --r2:#9bbb55; --r3:#5b9bd5; --r4:#ebc152;
  --font-display:"Jersey 10","Pixelify Sans",ui-monospace,monospace;
  --font-ui:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --meander:none;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--glaze);color:var(--bone);font-family:var(--font-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- game stage ---------- */
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px))}
#stage{position:relative;width:768px;height:432px;--px:2px;background:#000;box-shadow:0 0 0 2px var(--line),0 12px 48px #000c}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
#hud{position:absolute;inset:0;pointer-events:none;font-size:max(11px,calc(var(--px)*6.5));line-height:1.1;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.hud-top{position:absolute;top:calc(var(--px)*5);left:calc(var(--px)*6);right:calc(var(--px)*6);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hud-hp{display:grid;gap:calc(var(--px)*2.5)}
.bar{position:relative;height:calc(var(--px)*7);width:calc(var(--px)*84);background:#000a;box-shadow:0 0 0 max(1px,calc(var(--px)*.75)) #000,inset 0 0 0 max(1px,calc(var(--px)*.75)) #ffffff1a}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--blood);box-shadow:inset 0 calc(var(--px)*-2) 0 #0004}
.bar>span{position:absolute;inset:0;display:flex;align-items:center;padding-left:calc(var(--px)*3);font-weight:600;font-size:.9em}
.bar.low>i{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{background:#ff7a5c}}
.pips{display:flex;gap:calc(var(--px)*3)}
.pip{position:relative;display:flex;align-items:center;gap:calc(var(--px)*2);font-size:.8em;color:var(--bone-dim)}
.pip i{width:calc(var(--px)*6);height:calc(var(--px)*6);background:var(--gold);box-shadow:0 0 0 max(1px,calc(var(--px)*.75)) #000}
.pip.cool i{background:#3a302a}
.pip.cool b{color:var(--bone-mute)}
.pip b{font-weight:500;color:var(--bone)}
.hud-wave{font-family:var(--font-display);font-size:1.5em;letter-spacing:.04em;color:var(--bone);text-align:center}
.hud-loot{display:flex;align-items:baseline;gap:calc(var(--px)*2);color:var(--bone-dim);font-size:.85em}
.hud-loot b{color:var(--gold);font-size:1.3em;font-variant-numeric:tabular-nums}
#lootFeed{position:absolute;left:calc(var(--px)*6);bottom:calc(var(--px)*6);display:grid;gap:calc(var(--px)*1.5)}
.feed{display:flex;align-items:center;gap:calc(var(--px)*2);font-size:.85em;animation:feedIn .18s ease-out}
.feed img{width:calc(var(--px)*8);height:calc(var(--px)*8);image-rendering:pixelated}
.feed b{color:var(--gold);font-weight:600}
.feed.out{opacity:0;transition:opacity .4s}
@keyframes feedIn{from{transform:translateX(-8px);opacity:0}}
#bossBar{position:absolute;left:50%;bottom:calc(var(--px)*8);transform:translateX(-50%);display:grid;gap:calc(var(--px)*1.5);justify-items:center}
#bossBar .bar{width:calc(var(--px)*190);height:calc(var(--px)*6)}
#bossBar .bar>i{background:var(--gold)}
.boss-label{display:flex;gap:calc(var(--px)*3);align-items:baseline}
.boss-label b{font-family:var(--font-display);font-size:1.6em;letter-spacing:.06em;color:var(--gold);font-weight:400}
.boss-label span{color:var(--bone-dim);font-size:.85em}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;animation:bannerIn 2.2s ease-out forwards}
#bannerMain{font-family:var(--font-display);font-size:3.2em;letter-spacing:.05em;color:var(--bone);line-height:1}
#bannerSub{margin-top:calc(var(--px)*2);color:var(--gold);font-size:1em;padding:0 calc(var(--px)*10)}
#banner::before{content:"";position:absolute;left:10%;right:10%;top:-18%;bottom:-30%;z-index:-1;background:radial-gradient(ellipse at center,#0009 0%,#0005 45%,transparent 72%)}
#bannerSub:empty{display:none}
#banner.boss #bannerMain{color:var(--gold);font-size:4em}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.15)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* village HUD, prompts and dialogue */
#vhud{position:absolute;top:calc(var(--px)*5);left:calc(var(--px)*6);right:calc(var(--px)*6);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#vhud .place{font-family:var(--font-display);font-size:1.7em;letter-spacing:.05em;color:var(--bone)}
#vhud .money{color:var(--bone-dim);font-size:.9em}
#vhud .money b{color:var(--gold);font-size:1.4em;font-variant-numeric:tabular-nums}
#prompt{position:absolute;left:50%;bottom:calc(var(--px)*8);transform:translateX(-50%);background:#000c;padding:calc(var(--px)*2) calc(var(--px)*4);box-shadow:0 0 0 max(1px,calc(var(--px)*.75)) var(--line);white-space:nowrap}
#prompt kbd,#dialog kbd{font-family:var(--font-ui);color:var(--gold);background:#000;padding:0 .35em;box-shadow:inset 0 -2px 0 #3e2c24;text-shadow:none}
#dialog{position:absolute;left:calc(var(--px)*14);right:calc(var(--px)*14);bottom:calc(var(--px)*7);background:var(--glaze-2);text-shadow:none;pointer-events:auto;cursor:pointer;
  box-shadow:0 0 0 max(2px,var(--px)) #000,0 0 0 calc(max(2px,var(--px))*2) var(--clay);padding:calc(var(--px)*5) calc(var(--px)*7);display:grid;gap:calc(var(--px)*2)}
#dialog .who{font-family:var(--font-display);font-size:1.45em;color:var(--clay-hi);letter-spacing:.04em;line-height:1}
#dialog .line{font-size:1.05em;line-height:1.35;min-height:2.7em}
#dialog .more{justify-self:end;color:var(--bone-dim);font-size:.8em}
#pause{position:absolute;inset:0;background:#0b0706d9;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.pause-card{background:var(--glaze-2);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);padding:18px 20px;display:grid;gap:12px;width:min(340px,100%)}
.pause-card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:2.4em;line-height:1;letter-spacing:.04em}
.pause-card .stack{display:grid;gap:8px}
#rotate{display:none;position:absolute;inset:0;background:var(--glaze);align-items:center;justify-content:center;text-align:center;padding:20px;font-size:1.1em;z-index:5}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;top:18%;bottom:0;width:48%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:#0006;box-shadow:inset 0 0 0 2px #f0e4cc44;opacity:0;transition:opacity .15s}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:28px;top:28px;width:32px;height:32px;border-radius:50%;background:#f0e4cc99}
#touchBtns{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:8px;align-items:end;pointer-events:auto}
#touchBtns button{width:58px;height:58px;border-radius:50%;border:0;background:#0007;color:var(--bone);font-size:12px;font-weight:600;box-shadow:inset 0 0 0 2px #f0e4cc55;touch-action:none}
#touchBtns button.big{width:74px;height:74px;background:#cf6a2fcc;color:#130d0b;grid-row:1/3;grid-column:2}
#touchBtns button:active,#touchBtns button.on{background:#f0e4cc55}
#tPause{position:absolute;top:calc(var(--px)*20);right:calc(var(--px)*6);pointer-events:auto;width:40px;height:30px;border:0;background:#0007;color:var(--bone);box-shadow:inset 0 0 0 2px #f0e4cc44;font-weight:700}

/* ---------- menu screens ---------- */
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;overflow-x:hidden;background:var(--glaze);
  background-image:radial-gradient(ellipse at 50% -10%,#3a1f1366 0%,transparent 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:18px}
.meander{height:16px;background-image:var(--meander);background-repeat:repeat-x;background-size:12px 16px;image-rendering:pixelated}
.eyebrow{margin:0;color:var(--clay-hi);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h2,h3{text-wrap:balance}
.muted{color:var(--bone-dim)}
.btn{font:600 1rem/1 var(--font-ui);color:#160e0b;background:var(--clay);border:0;padding:11px 18px;cursor:pointer;
  box-shadow:inset 0 -3px 0 var(--clay-lo),0 0 0 2px #000;letter-spacing:.02em;white-space:nowrap}
.btn:hover{background:var(--clay-hi)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 var(--clay-lo),0 0 0 2px #000}
.btn:disabled{background:var(--glaze-3);color:var(--bone-mute);box-shadow:0 0 0 2px #000;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--clay)}
.btn.danger{background:var(--blood);box-shadow:inset 0 -3px 0 #7a2018,0 0 0 2px #000}
.btn.small{padding:8px 12px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
kbd{font-family:var(--font-ui);font-size:.82rem;color:var(--gold);background:#000;padding:1px 5px;box-shadow:inset 0 -2px 0 #3e2c24}
.tip{margin:0;color:var(--bone-dim);font-size:.92rem;max-width:62ch}

/* title */
.title-wrap{max-width:720px;justify-items:center;text-align:center;padding-top:2vh}
.logo{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(64px,15vw,132px);line-height:.82;letter-spacing:.03em;color:var(--clay);text-shadow:4px 4px 0 #000;text-transform:uppercase}
#titleArt{width:min(720px,100%);height:auto;aspect-ratio:272/44;image-rendering:pixelated;max-width:100%}
.lede{max-width:52ch;margin:0;color:var(--bone-dim);font-size:1.05rem}
.controls{width:100%;display:flex;flex-wrap:wrap;gap:2px;background:#000;box-shadow:0 0 0 2px var(--line);text-align:left}
.controls div{flex:1 1 150px;background:var(--glaze-2);padding:10px 12px;display:grid;gap:2px;align-content:start}
.controls b{font-weight:600;color:var(--bone)}
.controls span{color:var(--bone-dim);font-size:.88rem}

/* slots */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:2.6rem;line-height:1;letter-spacing:.03em}
.slots{display:grid;gap:12px}
.slot{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--glaze-2);padding:16px 18px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.slot.empty{background:transparent}
.slot-n{font-family:var(--font-display);font-size:2.4rem;line-height:1;color:var(--clay);min-width:1.4ch}
.slot-main{display:grid;gap:2px;min-width:0}
.slot-main b{font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}
.slot-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.warn{color:var(--blood);font-weight:600}
@media (max-width:560px){.slot{grid-template-columns:1fr}.slot-actions{justify-content:flex-start}}

/* building panels */
.panel-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hub-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hub-title{margin:2px 0 0;font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,72px);line-height:.85;letter-spacing:.03em;color:var(--bone)}
.purse{display:flex;align-items:baseline;gap:8px;font-size:1.05rem;color:var(--bone-dim)}
.purse b{font-family:var(--font-display);font-weight:400;font-size:2.4rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.quote{margin:0;color:var(--bone);font-size:1.02rem;max-width:62ch}
.quote span{color:var(--bone-mute)}
.equip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.equip-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--glaze-2);padding:12px 14px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.equip-card .lbl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute)}
.equip-card b{display:block;font-size:1.05rem}
.equip-card span{color:var(--bone-dim);font-size:.9rem}
.px-icon{image-rendering:pixelated;width:40px;height:40px;background:#000;box-shadow:inset 0 0 0 2px var(--line);padding:4px;box-sizing:border-box}

/* quest board */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.qlist{display:grid;gap:8px}
.chapter{margin:8px 0 0;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--clay-hi);font-weight:600}
.chapter:first-child{margin-top:0}
.qcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;background:var(--glaze-2);border:0;color:var(--bone);padding:12px 14px;cursor:pointer;box-shadow:0 0 0 2px #000,inset 4px 0 0 var(--glaze-3);font:inherit}
.qcard:hover{box-shadow:0 0 0 2px #000,inset 4px 0 0 var(--clay-lo)}
.qcard.sel{box-shadow:0 0 0 2px #000,inset 4px 0 0 var(--clay);background:var(--glaze-3)}
.qcard.locked{opacity:.55}
.qcard .god{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute)}
.qcard .name{font-size:1.08rem;font-weight:600;grid-column:1}
.qcard .stars{color:var(--gold);font-size:.85rem;letter-spacing:.1em;grid-column:2;grid-row:1}
.qcard .st{grid-column:2;grid-row:2;justify-self:end;display:flex;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;padding:3px 8px;background:#000;color:var(--bone-dim);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.chip img{width:16px;height:16px;image-rendering:pixelated}
.chip.new{color:#160e0b;background:var(--gold);box-shadow:none;font-weight:600}
.chip.done{color:var(--olive)}
.chip.urgent{color:#160e0b;background:var(--blood);box-shadow:none;font-weight:600}
.chip.ok b{color:var(--olive)}
.chip.short{color:var(--bone-dim)}
.chip.short b{color:var(--blood)}
.qdetail{background:var(--glaze-2);padding:18px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line);display:grid;gap:14px;align-content:start}
.qdetail h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:2.3rem;line-height:.95;letter-spacing:.02em}
.qdetail p{margin:0;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:#000}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div{background:var(--glaze);padding:8px 10px;display:grid}
.facts span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-mute)}
.facts b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.facts b.gold{color:var(--gold)}
.facts b.good{color:var(--olive)}
.sub{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* armory */
.seg{display:inline-flex;box-shadow:0 0 0 2px var(--line)}
.seg button{background:transparent;border:0;color:var(--bone-dim);font:600 .95rem var(--font-ui);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--clay);color:#160e0b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.gear{background:var(--glaze-2);padding:14px;display:grid;gap:10px;align-content:start;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.gear.equipped{box-shadow:0 0 0 2px #000,0 0 0 4px var(--clay)}
.gear-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.gear-head b{display:block;font-size:1.08rem}
.gear-head span{color:var(--bone-dim);font-size:.85rem}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.stats span{color:var(--bone-mute)}
.stats b{color:var(--bone);font-variant-numeric:tabular-nums}
.stats .up{color:var(--olive)}
.stats .down{color:var(--blood)}
.ability{background:#000;padding:8px 10px;box-shadow:inset 3px 0 0 var(--gold);font-size:.9rem}
.ability b{color:var(--gold)}
.gear .desc{margin:0;color:var(--bone-dim);font-size:.9rem}
.gear .actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* stash */
.stash{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--glaze-2);padding:12px;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.mat b{display:block}
.mat .qty{font-family:var(--font-display);font-size:2rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.mat p{margin:2px 0 0;font-size:.85rem;color:var(--bone-dim)}
.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.empty-note{background:var(--glaze-2);padding:22px;text-align:center;color:var(--bone-dim);box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}

/* options */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.opt{background:var(--glaze-2);padding:16px;display:grid;gap:10px;align-content:start;box-shadow:0 0 0 2px #000,0 0 0 4px var(--line)}
.opt h3{margin:0;font-size:1.1rem}
.opt p{margin:0;color:var(--bone-dim);font-size:.92rem}
.opt.wide{grid-column:1/-1}
textarea{width:100%;box-sizing:border-box;min-height:84px;background:#000;color:var(--bone);border:0;box-shadow:inset 0 0 0 2px var(--line);padding:8px;font:.8rem/1.3 ui-monospace,monospace;resize:vertical;user-select:text;-webkit-user-select:text}
textarea:focus{outline:2px solid var(--gold)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px}
.binds{display:grid}
.bind-row{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bind-row>span{font-weight:600}
.bind-keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.keycap{font:600 .88rem var(--font-ui);color:var(--gold);background:#000;border:0;padding:6px 9px;cursor:pointer;box-shadow:inset 0 -2px 0 var(--line),0 0 0 1px var(--line)}
.keycap:hover{color:var(--blood)}
.keycap i{font-style:normal;color:var(--bone-mute);margin-left:6px}
.btn.listening{background:var(--gold);animation:pulse .6s steps(2) infinite}
@media (max-width:480px){.bind-row{grid-template-columns:1fr}}

/* results */
.results{max-width:720px}
.res-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,88px);line-height:.9;letter-spacing:.03em}
.res-title.win{color:var(--gold)}
.res-title.lose{color:var(--blood)}
